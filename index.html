<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保守ナレッジ閲覧ツール</title>
<style>
  :root{
    --bg:#EEF0ED; --surface:#FFFFFF; --surface2:#F7F8F6;
    --ink:#1A241E; --muted:#6A716B;
    --line:rgba(26,36,30,.12); --line-strong:rgba(26,36,30,.24);
    --accent:#0F6E56; --accent-soft:#E1F0EB;
    --ok:#1D8A66; --ok-bg:#E4F3EC;
    --warn:#9A6310; --warn-bg:#F8EFDB;
    --crit:#A82C2C; --crit-bg:#F9E8E6;
    --neutral:#7C827C; --neutral-bg:#E9EBE8;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--jp);
    font-size:14px; line-height:1.6; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:rgba(15,110,86,.15);
  }
  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--accent); font-weight:600}

  /* Header */
  header{background:var(--surface); border-bottom:1px solid var(--line-strong);
    padding:14px 22px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
  header h1{margin:2px 0 0; font-size:19px; font-weight:600; letter-spacing:.01em}
  .h-right{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .status{font-family:var(--mono); font-size:12px; color:var(--muted); display:flex; align-items:center; gap:7px}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--neutral); flex:none}
  .dot.live{background:var(--ok)}
  button,.btn{font-family:var(--jp); font-size:13px; cursor:pointer; border-radius:7px; border:1px solid var(--line-strong);
    background:var(--surface2); color:var(--ink); padding:8px 14px; transition:background .12s,border-color .12s}
  button:hover,.btn:hover{background:#fff; border-color:var(--accent)}
  .btn-primary{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:500}
  .btn-primary:hover{background:#0c5a47; border-color:#0c5a47}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* Toolbar */
  .toolbar{background:var(--surface); border-bottom:1px solid var(--line);
    padding:12px 22px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .field{display:flex; flex-direction:column; gap:3px}
  .field label{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
  .toolbar input,.toolbar select{font-family:var(--jp); font-size:16px; padding:8px 9px;
    border:1px solid var(--line-strong); border-radius:6px; background:var(--surface2); color:var(--ink)}
  .toolbar input[type=search]{min-width:230px}
  .toolbar input:focus,.toolbar select:focus{outline:none; border-color:var(--accent); background:#fff}
  .grow{flex:1}

  /* Layout */
  main{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:1px;
    background:var(--line); overflow:hidden}
  .panel{background:var(--surface); min-height:0; display:flex; flex-direction:column; overflow:hidden}
  .panel-head{padding:10px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center;
    justify-content:space-between; gap:10px; flex:none}
  .panel-head .count{font-family:var(--mono); font-size:12px; color:var(--muted)}
  .scroll{overflow:auto; min-height:0; flex:1}

  /* Results table */
  table{width:100%; border-collapse:collapse}
  thead th{position:sticky; top:0; z-index:1; background:var(--surface2);
    font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
    text-align:left; font-weight:600; padding:9px 12px; border-bottom:1px solid var(--line-strong)}
  tbody td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--accent-soft)}
  tbody tr.sel{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent)}
  .c-date{font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap}
  .c-eq{font-weight:500; white-space:nowrap}
  .c-defect{color:var(--ink); max-width:340px}
  td .sub{font-size:12px; color:var(--muted)}

  .badge{display:inline-block; font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius:999px; white-space:nowrap}
  .sev-ok{background:var(--ok-bg); color:var(--ok)}
  .sev-warn{background:var(--warn-bg); color:var(--warn)}
  .sev-crit{background:var(--crit-bg); color:var(--crit)}
  .sev-neutral{background:var(--neutral-bg); color:var(--neutral)}

  mark{background:#FCE7A1; color:inherit; padding:0 1px; border-radius:2px}

  /* Detail */
  .detail{padding:18px}
  .detail .hint{color:var(--muted); font-size:13px; padding:30px 6px}
  .d-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
  .d-top .id{font-family:var(--mono); font-size:12px; color:var(--muted)}
  .d-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; margin-bottom:16px}
  .d-cell .k{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
  .d-cell .v{font-size:14px; margin-top:1px}
  .d-block{margin-bottom:14px}
  .d-block .k{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent); border-bottom:1px solid var(--line); padding-bottom:4px; margin-bottom:6px}
  .d-block .v{white-space:pre-wrap; font-size:14px; line-height:1.7}

  /* Empty / loading overlay */
  .overlay{position:fixed; inset:0; background:rgba(238,240,237,.94); display:flex; align-items:center; justify-content:center; z-index:10}
  .drop{background:var(--surface); border:1px dashed var(--line-strong); border-radius:14px; padding:40px 44px;
    max-width:440px; text-align:center; transition:border-color .15s, background .15s}
  .drop.over{border-color:var(--accent); background:var(--accent-soft)}
  .drop h2{font-size:17px; margin:14px 0 8px}
  .drop p{color:var(--muted); font-size:13px; margin:6px 0 18px; line-height:1.7}
  .drop .err{color:var(--crit); font-size:13px; margin-top:12px; min-height:18px}
  .mark-sq{width:34px; height:34px; border-radius:8px; background:var(--accent); display:inline-block}

  @media (max-width:860px){
    main{grid-template-columns:1fr; grid-template-rows:1fr 1fr}
    .toolbar input[type=search]{min-width:140px}
    .c-defect{max-width:200px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">保守ナレッジ &middot; Incident DB</div>
    <h1>設備故障・対応履歴 閲覧ツール</h1>
  </div>
  <div class="h-right">
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">DB未読込</span></div>
    <button class="btn-primary" id="openBtn">DBファイルを開く</button>
    <input type="file" id="fileInput" accept=".sqlite,.db,.sqlite3" hidden>
  </div>
</header>

<div class="toolbar">
  <div class="field grow" style="max-width:380px">
    <label for="kw">キーワード検索</label>
    <input type="search" id="kw" placeholder="不良内容・調査結果・備考・機種をまとめて検索">
  </div>
  <div class="field">
    <label for="eq">機種名</label>
    <select id="eq"><option value="">すべて</option></select>
  </div>
  <div class="field">
    <label for="ft">故障種別</label>
    <select id="ft"><option value="">すべて</option></select>
  </div>
  <div class="field">
    <label for="from">対応日 (から)</label>
    <input type="date" id="from">
  </div>
  <div class="field">
    <label for="to">対応日 (まで)</label>
    <input type="date" id="to">
  </div>
  <div class="field">
    <label>&nbsp;</label>
    <button id="clearBtn">条件クリア</button>
  </div>
</div>

<main>
  <section class="panel">
    <div class="panel-head">
      <span class="eyebrow">検索結果</span>
      <span class="count" id="resultCount">— 件</span>
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th>対応日</th><th>機種名</th><th>故障種別</th><th>不良内容</th><th>稼働状況</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><span class="eyebrow">詳細</span></div>
    <div class="scroll"><div class="detail" id="detail">
      <div class="hint">左の一覧から行を選択すると、調査結果・備考を含む全項目を表示します。</div>
    </div></div>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="drop" id="drop">
    <span class="mark-sq"></span>
    <h2>保守ナレッジを読み込み中…</h2>
    <p id="autoNote">同じフォルダの <b>incident_db.sqlite</b> を読み込んでいます。データはお使いの端末のブラウザ内だけで処理され、どこにも送信されません。</p>
    <button class="btn-primary" id="openBtn2">手動でファイルを選択</button>
    <div class="err" id="err"></div>
  </div>
</div>

<script src="sql-wasm.js"></script>
<script>
let db=null, SQLlib=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hi(text,kw){
  if(text==null) return '';
  if(!kw) return esc(text);
  return String(text).split(kw).map(esc).join('<mark>'+esc(kw)+'</mark>');
}
function severity(s){
  if(!s) return {cls:'sev-neutral',label:'—'};
  const t=s.replace(/\s/g,'');
  if(/(監視不可|監視操作不可|監視制御不可|制御不可|運転不能|運用離脱|ボイラ停止|^停止|運転停止)/.test(t)) return {cls:'sev-crit',label:s.split('\n')[0]};
  if(/(手動|仮復旧|支障|渋滞|片系)/.test(t)) return {cls:'sev-warn',label:s.split('\n')[0]};
  if(/(運転継続|通常稼働|通常運用|運転稼働|稼働中|運用中)/.test(t)) return {cls:'sev-ok',label:s.split('\n')[0]};
  return {cls:'sev-neutral',label:s.split('\n')[0]};
}
const COLS=['id','item_no','response_date','equipment_type','model_number','model_name',
  'series_name','failure_type','defect_name','situation','operation_status','investigation_result','remarks'];

function query(sql,params){
  const st=db.prepare(sql); if(params) st.bind(params);
  const out=[]; while(st.step()) out.push(st.getAsObject()); st.free(); return out;
}

async function ensureEngine(){
  if(!SQLlib){
    $('statusText').textContent='エンジン読込中…';
    SQLlib=await initSqlJs({locateFile:f=>'./'+f});
  }
}
async function loadBuffer(buf,name){
  $('err').textContent='';
  try{
    await ensureEngine();
    db=new SQLlib.Database(new Uint8Array(buf));
    query("SELECT 1 FROM incidents LIMIT 1"); // 妥当性チェック
    onLoaded(name);
  }catch(e){
    $('err').textContent='読み込めませんでした: '+(e.message||e)+'  （incidents テーブルを含むSQLiteファイルか確認してください）';
    $('statusText').textContent='DB未読込';
  }
}
async function loadFile(file){ await loadBuffer(await file.arrayBuffer(), file.name); }

// 同じディレクトリの incident_db.sqlite を自動読み込み（GitHub Pages等のhttp配信時）
async function autoLoad(){
  try{
    const resp=await fetch('incident_db.sqlite',{cache:'no-store'});
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    await loadBuffer(await resp.arrayBuffer(),'incident_db.sqlite');
  }catch(e){
    // 自動読込に失敗（file://で開いた等）→ 手動選択にフォールバック
    $('overlay').style.display='flex';
    $('autoNote').textContent='同ディレクトリのDBを自動取得できませんでした。ファイルを選択してください。';
  }
}

function fillSelect(sel,col){
  const rows=query(`SELECT DISTINCT ${col} v FROM incidents WHERE ${col} IS NOT NULL ORDER BY ${col}`);
  sel.innerHTML='<option value="">すべて</option>'+rows.map(r=>`<option>${esc(r.v)}</option>`).join('');
}

function onLoaded(name){
  $('overlay').style.display='none';
  $('dot').classList.add('live');
  fillSelect($('eq'),'equipment_type');
  fillSelect($('ft'),'failure_type');
  const total=query("SELECT COUNT(*) c FROM incidents")[0].c;
  $('statusText').textContent=`${esc(name)} ・ 全${total}件`;
  search();
}

function search(){
  if(!db) return;
  const kw=$('kw').value.trim();
  const cond=[], p={};
  if(kw){
    p.$like='%'+kw+'%';
    cond.push(`(defect_name LIKE $like OR situation LIKE $like OR investigation_result LIKE $like
      OR remarks LIKE $like OR equipment_type LIKE $like OR model_number LIKE $like OR model_name LIKE $like
      OR series_name LIKE $like OR failure_type LIKE $like)`);
  }
  if($('eq').value){cond.push('equipment_type = $eq'); p.$eq=$('eq').value;}
  if($('ft').value){cond.push('failure_type = $ft'); p.$ft=$('ft').value;}
  if($('from').value){cond.push('response_date >= $from'); p.$from=$('from').value;}
  if($('to').value){cond.push('response_date <= $to'); p.$to=$('to').value;}
  const where=cond.length?'WHERE '+cond.join(' AND '):'';
  const rows=query(`SELECT ${COLS.join(',')} FROM incidents ${where}
    ORDER BY response_date DESC, item_no DESC`,p);
  render(rows,kw);
}

function render(rows,kw){
  $('resultCount').textContent=`${rows.length} 件`;
  const tb=$('rows');
  if(!rows.length){ tb.innerHTML=`<tr><td colspan="5" style="padding:26px;color:var(--muted)">該当するインシデントはありません。条件を変えてお試しください。</td></tr>`; setDetail(null); return; }
  tb.innerHTML=rows.map((r,i)=>{
    const sv=severity(r.operation_status);
    return `<tr data-i="${i}">
      <td class="c-date">${esc(r.response_date||'')}</td>
      <td class="c-eq">${hi(r.equipment_type||'—',kw)}${r.model_number?`<div class="sub">${hi(r.model_number,kw)}</div>`:''}</td>
      <td>${hi(r.failure_type||'—',kw)}</td>
      <td class="c-defect">${hi(r.defect_name||'—',kw)}</td>
      <td><span class="badge ${sv.cls}">${esc(sv.label)}</span></td>
    </tr>`;
  }).join('');
  Array.from(tb.children).forEach(tr=>{
    tr.onclick=()=>{
      Array.from(tb.children).forEach(x=>x.classList.remove('sel'));
      tr.classList.add('sel');
      setDetail(rows[+tr.dataset.i],kw);
    };
  });
  setDetail(rows[0],kw);
  tb.firstElementChild.classList.add('sel');
}

function cell(k,v,kw){ return `<div class="d-cell"><div class="k">${k}</div><div class="v">${v?hi(v,kw):'—'}</div></div>`; }
function block(k,v,kw){ if(!v) return ''; return `<div class="d-block"><div class="k">${k}</div><div class="v">${hi(v,kw)}</div></div>`; }

function setDetail(r,kw){
  const d=$('detail');
  if(!r){ d.innerHTML='<div class="hint">左の一覧から行を選択すると、調査結果・備考を含む全項目を表示します。</div>'; return; }
  const sv=severity(r.operation_status);
  d.innerHTML=`
    <div class="d-top">
      <span class="badge ${sv.cls}">${esc(r.operation_status?r.operation_status.split('\n')[0]:'—')}</span>
      <span class="id">項目 #${esc(r.item_no??'')} ・ ${esc(r.response_date||'')}</span>
    </div>
    <div class="d-grid">
      ${cell('機種名',r.equipment_type,kw)}
      ${cell('故障種別',r.failure_type,kw)}
      ${cell('型式',r.model_number,kw)}
      ${cell('モデル名',r.model_name,kw)}
      ${cell('シリーズ名',r.series_name,kw)}
      ${cell('設備稼働状況',r.operation_status,kw)}
    </div>
    ${block('不良内容名',r.defect_name,kw)}
    ${block('状況',r.situation,kw)}
    ${block('調査結果',r.investigation_result,kw)}
    ${block('備考',r.remarks,kw)}
  `;
}

// events
$('openBtn').onclick=$('openBtn2').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); };
['kw','eq','ft','from','to'].forEach(id=>{ const el=$(id); el.oninput=search; el.onchange=search; });
$('clearBtn').onclick=()=>{ ['kw','eq','ft','from','to'].forEach(id=>$(id).value=''); search(); };

const drop=$('drop');
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) loadFile(f); });

// 起動時：同ディレクトリのDBを自動読み込み
autoLoad();

</script>
</body>
</html>

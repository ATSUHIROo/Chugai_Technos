<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>保守ナレッジ閲覧ツール</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div>
    <div class="eyebrow">保守ナレッジ &middot; Incident DB</div>
    <h1>設備故障・対応履歴 閲覧ツール</h1>
  </div>
  <div class="h-right">
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">DB未読込</span></div>
    <button class="btn-primary openBtn" id="openBtn">DBファイルを開く</button>
    <input type="file" id="fileInput" accept=".sqlite,.db,.sqlite3" hidden>
    <button class="hamburger" id="menuBtn" aria-label="検索・絞り込みを開く"><span></span><span></span><span></span></button>
  </div>
</header>

<div class="toolbar" id="toolbar">
  <div class="drawer-head">
    <span class="eyebrow">検索・絞り込み</span>
    <button id="drawerClose" aria-label="閉じる">&times;</button>
  </div>
  <div class="field grow" style="max-width:380px">
    <label for="kw">キーワード検索</label>
    <input type="search" id="kw" placeholder="不良内容・調査結果・備考・機種をまとめて検索">
  </div>
  <div class="field">
    <label for="eq">機種名</label>
    <select id="eq"><option value="">すべて</option></select>
  </div>
  <div class="field">
    <label for="ft">故障種別</label>
    <select id="ft"><option value="">すべて</option></select>
  </div>
  <div class="field">
    <label for="from">対応日 (から)</label>
    <input type="date" id="from">
  </div>
  <div class="field">
    <label for="to">対応日 (まで)</label>
    <input type="date" id="to">
  </div>
  <div class="field">
    <label>&nbsp;</label>
    <button id="clearBtn">条件クリア</button>
  </div>
  <button class="btn-primary drawer-apply" id="drawerApply">結果を見る</button>
</div>

<main>
  <section class="panel">
    <div class="panel-head">
      <span class="eyebrow">検索結果</span>
      <span class="count" id="resultCount">— 件</span>
    </div>
    <div class="scroll">
      <table>
        <thead><tr>
          <th>対応日</th><th>機種名</th><th>故障種別</th><th>不良内容</th><th>稼働状況</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <section class="panel detail-panel" id="detailPanel">
    <div class="panel-head">
      <button class="back-btn" id="detailBack">&larr; 一覧へ戻る</button>
      <span class="eyebrow">詳細</span>
    </div>
    <div class="scroll"><div class="detail" id="detail">
      <div class="hint">一覧から行を選択すると、調査結果・備考を含む全項目を表示します。</div>
    </div></div>
  </section>
</main>

<div class="backdrop" id="backdrop"></div>

<div class="overlay" id="overlay">
  <div class="drop" id="drop">
    <span class="mark-sq"></span>
    <h2>保守ナレッジを読み込み中…</h2>
    <p id="autoNote">同じフォルダの <b>incident_db.sqlite</b> を読み込んでいます。データはお使いの端末のブラウザ内だけで処理され、どこにも送信されません。</p>
    <button class="btn-primary" id="openBtn2">手動でファイルを選択</button>
    <div class="err" id="err"></div>
  </div>
</div>

<script src="sql-wasm.js"></script>
<script src="app.js"></script>
</body>
</html>
